name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate release version
        run: |
          mkdir site
          rsync -a --exclude='.git' --exclude='.github' --exclude='.vscode' --exclude='site' ./ site/
          release_date=$(date -u +%Y.%m.%d)
          release_version="${release_date}-${GITHUB_SHA:0:7}"
          printf '{"release":"%s","commit":"%.7s"}\n' "$release_version" "$GITHUB_SHA" > site/version.json
          # Cache-bust local assets so browsers always fetch CSS/JS matching this deploy.
          sed -i "s|href=\"style.css\"|href=\"style.css?v=${GITHUB_SHA:0:7}\"|g" site/index.html
          sed -i "s|src=\"script.js\"|src=\"script.js?v=${GITHUB_SHA:0:7}\"|g" site/index.html

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
