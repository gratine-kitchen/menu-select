name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate release version
        run: |
          mkdir site
          # Publish a same-origin fallback copy of the menu sheet.
          curl -sSL --retry 3 --retry-delay 2 --max-time 60 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQp_lmQ3G1BBHVC5Lotsbtid6IO9kA83VGmKeI2e_Q31_LXtsFM8v2ZyvloRxo7FMixbu46ofyPq9JF/pub?gid=0&single=true&output=csv' -o site/menu.csv || echo "Warning: menu.csv could not be fetched"
          rsync -a --exclude='.git' --exclude='.github' --exclude='.vscode' --exclude='site' ./ site/
          release_date=$(date -u +%Y.%m.%d)
          release_version="${release_date}-${GITHUB_SHA:0:7}"
          printf '{"release":"%s","commit":"%.7s"}\n' "$release_version" "$GITHUB_SHA" > site/version.json
          # Cache-bust local assets so browsers always fetch CSS/JS matching this deploy.
          sed -i "s|href=\"style.css\"|href=\"style.css?v=${GITHUB_SHA:0:7}\"|g" site/index.html
          sed -i "s|src=\"script.js\"|src=\"script.js?v=${GITHUB_SHA:0:7}\"|g" site/index.html

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
